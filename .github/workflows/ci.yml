# Tier 1 checks: free, deterministic, no model calls.
#
# Tier 2 -- content and trigger evals -- is deliberately NOT here. It
# needs real GitHub repositories, model calls, and human checkpoints.
# See docs/devs/testing.md for the split and why it matters.
#
# One job with named steps rather than parallel jobs: this produces a
# single status-check context, which is what a branch ruleset would
# require by name, and avoids paying runner startup three times on a
# repository this small.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tier 1 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Explicitly set up Python version rather than relying on
      # whatever the runner image happens to ship. The checks fail
      # loudly on a missing interpreter, so an image change would
      # break the build rather than silently skip a check.
      # Not having to find that out is better.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Lint skills
        run: bash tests/lint-skills.sh

      - name: Check documentation links
        run: bash tests/check-links.sh

      - name: Check workflow template
        run: bash tests/check-workflow-template.sh

      # Guards the requirement-id citations between behavior-spec.md,
      # the eval files, and the three registers. Also resolves doc
      # paths cited from inside the eval JSON, which check-links.sh
      # cannot see because it reads markdown only.
      - name: Check requirement ids
        run: bash tests/check-requirement-ids.sh

      # Offline check only on purpose. We don't use `claude plugin
      # validate` here because that richer check needs the Claude Code
      # CLI, which CI would install at its latest version on every
      # run. A future CLI release that adds a rule or a warning would
      # start failing this job on unchanged files, so a pull request
      # would go red for a reason its author did not cause and cannot
      # fix. `claude plugin validate` stays a release step, run
      # deliberately against a known CLI version.
      - name: Check plugin manifests
        run: bash tests/check-plugin-manifests.sh
